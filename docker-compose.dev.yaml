version: '3.8'
services:
  shopco_frontend:
    image: node:22-alpine
    ports:
      - 3011:3011
    restart: unless-stopped
    container_name: shop_frontend_dev
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - PORT=3011
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
