services:
  shopco_frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${PORT:-8080}
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - '${PORT:-8080}:${PORT:-8080}'
    restart: unless-stopped
    container_name: shop_frontend
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - PORT=${PORT:-8080}
    env_file:
      - .env
