name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода
        uses: actions/checkout@v3

      - name: Установка Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Установка зависимостей
        run: npm install

      - name: Линтинг кода
        run: npm run lint

      - name: Проверка prettier
        run: npm run format:check

      - name: Запуск тестов
        run: npm test

      - name: Сборка проекта
        run: npm run build

      # - name: Deploy to server (опционально)
