name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка линтинга
        run: npm run lint

      - name: Проверка prettier
        run: npm run format

      # Отключение тестов на время разработки, так как их нет
      # - name: Запуск тестов
      #   run: npm run test

      - name: Проверка обновления версии
        if: github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main')
        run: |
          if git show HEAD^:package.json > /dev/null 2>&1; then
            PREV_VERSION=$(git show HEAD^:package.json | grep '"version"' | head -1 | awk -F '"' '{print $4}')
            CUR_VERSION=$(cat package.json | grep '"version"' | head -1 | awk -F '"' '{print $4}')
            echo "Предыдущая версия: $PREV_VERSION"
            echo "Текущая версия: $CUR_VERSION"
            if [ "$PREV_VERSION" = "$CUR_VERSION" ]; then
              echo "❌ Версия не изменена! Обновите версию в package.json."
              exit 1
            else
              echo "✅ Версия обновлена: $PREV_VERSION → $CUR_VERSION"
            fi
          else
            echo "⚠️ Нет предыдущего коммита, проверка версии пропущена."
          fi
