server {
    listen 8080;
    server_name melbet-kassa.ru localhost;  # Добавил localhost

    root /usr/share/nginx/html;
    index index.html;

    # Логирование для отладки
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш JS, CSS, шрифтов
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Кэш изображений
    location ~* \.(png|jpe?g|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.(mp4|avi|mov|wmv|flv|webm|mkv|m4v)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        
        # Для больших файлов
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # Специальная обработка фавиконок
    location ~ ^/favicon\.(ico|svg|png)$ {
        try_files $uri /mb-favicon.svg =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # GZIP (не сжимаем видео!)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript text/xml application/xml
        application/xml+rss text/javascript image/svg+xml;

    etag on;
}